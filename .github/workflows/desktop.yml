name: Desktop builds

# Windows, macOS and Linux builds of the desktop app (Electron, see desktop/). Runs by hand (Actions → Desktop builds →
# Run workflow) or for a version tag like v0.2.0; the builds end up as downloadable artifacts of the run.
on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'full or demo'
        default: full
        required: true
      steam_app_id:
        description: 'Steam App ID (empty: build without Steam)'
        default: ''
        required: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run ci

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PE_EDITION: ${{ github.event.inputs.edition || 'full' }}
      PE_STORE_URL: ${{ vars.PE_STORE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Steam App ID
        if: ${{ github.event.inputs.steam_app_id != '' && github.event.inputs.steam_app_id != null }}
        shell: bash
        run: echo "${{ github.event.inputs.steam_app_id }}" > desktop/steam/steam_appid.txt
      - run: npm run desktop:web
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      # macOS is signed and notarized when the Apple secrets are set (see STEAM.md: signing); otherwise and on
      # Windows/Linux the builds stay unsigned. Only set variables reach electron-builder (an empty CSC_LINK breaks it).
      - name: Code signing
        shell: bash
        env:
          CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_VALUE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$CERT" ]; then
            echo "CSC_LINK=$(printf '%s' "$CERT" | tr -d '\r\n ')" >> "$GITHUB_ENV"
            if [ -n "$CERT_PASSWORD" ]; then echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"; fi
            if [ -n "$APPLE_ID_VALUE" ]; then
              echo "APPLE_ID=$APPLE_ID_VALUE" >> "$GITHUB_ENV"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_PASSWORD_VALUE" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_VALUE" >> "$GITHUB_ENV"
              echo "signed and notarized build"
            else
              echo "signed build (no APPLE_ID: not notarized)"
            fi
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "unsigned build"
          fi
      - run: npx electron-builder --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: planet-escape-${{ env.PE_EDITION }}-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.tar.gz
          if-no-files-found: error
