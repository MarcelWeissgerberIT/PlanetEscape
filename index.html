<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#15171c" />
    <meta name="description" content="Planet Escape – build production chains, assemble a spaceship and escape the planet. Ein Fabrik-Aufbauspiel für Handy und Desktop." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Planet Escape" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Planet Escape</title>
    <script>
      // A deploy replaces every bundle; a page loaded in that moment may ask for a file that is gone. Reload once.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || t.tagName !== 'SCRIPT' && t.tagName !== 'LINK') return;
        try {
          if (sessionStorage.getItem('pe_reloaded')) return;
          sessionStorage.setItem('pe_reloaded', '1');
        } catch (_) {}
        setTimeout(function () { location.reload(); }, 1500);
      }, true);
      window.addEventListener('load', function () {
        setTimeout(function () { try { sessionStorage.removeItem('pe_reloaded'); } catch (_) {} }, 10000);
      });
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
