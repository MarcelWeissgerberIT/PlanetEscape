<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#15171c" />
    <meta name="description" content="Planet Escape – build production chains, assemble a spaceship and escape the planet. Ein Fabrik-Aufbauspiel für Handy und Desktop." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Planet Escape" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Planet Escape</title>
    <style>
      /* the bare layout, so the interface stays on top of the map even if the stylesheet is missing */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; }
      #game, #ui { position: absolute; inset: 0; }
      #ui { pointer-events: none; }
      #ui > * { pointer-events: auto; }
    </style>
    <script>
      // A deploy replaces every bundle; a page loaded in that moment may ask for a file that is gone. Reload, at most once a minute.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || (t.tagName !== 'SCRIPT' && !(t.tagName === 'LINK' && /stylesheet|modulepreload/.test(t.rel)))) return;
        try {
          var last = +sessionStorage.getItem('pe_reload_at') || 0;
          if (Date.now() - last < 60000) return;
          sessionStorage.setItem('pe_reload_at', String(Date.now()));
        } catch (_) {}
        setTimeout(function () { location.reload(); }, 1500);
      }, true);
      // Rescue: if the game has not drawn its interface after 8 s, offer to clear the offline cache (the save stays).
      function peReset() {
        var jobs = [];
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      }
      function peRescue() {
        if (document.getElementById('pe-rescue')) return;
        var box = document.createElement('div');
        box.id = 'pe-rescue';
        box.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#15171c;color:#e2e8f0;font:15px system-ui,sans-serif;z-index:99;text-align:center;padding:16px;pointer-events:auto';
        box.innerHTML = '<div style="max-width:420px"><h2 style="margin:0 0 8px">Planet Escape</h2><p>Das Spiel lädt nicht richtig? Oft hilft es, den Offline-Speicher zu leeren. Dein Spielstand bleibt erhalten.<br><small style="opacity:.7">Not loading properly? Clearing the offline cache usually helps. Your save is kept.</small></p><button style="margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#22d3ee;color:#0b0e12;font-weight:700;font-size:15px;cursor:pointer">Cache leeren und neu laden</button></div>';
        box.querySelector('button').onclick = peReset;
        document.body.appendChild(box);
      }
      function peCssOk() {
        return getComputedStyle(document.documentElement).getPropertyValue('--pe-css').trim() === '1';
      }
      // Stylesheet check: if it did not arrive, fetch it again under a fresh address (past every cache).
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (peCssOk()) return;
          var old = document.querySelector('link[rel="stylesheet"]');
          if (old) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = old.href.split('?')[0] + '?r=' + Date.now();
            document.head.appendChild(l);
          }
          setTimeout(function () { if (!peCssOk()) peRescue(); }, 4000);
        }, 1500);
      });
      // Rescue: if the game has not drawn its interface after 8 s, offer to clear the offline cache (the save stays).
      setTimeout(function () {
        var ui = document.getElementById('ui');
        if (!ui || !ui.children.length) peRescue();
      }, 8000);
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
